<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Percent Calculator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <form class="calculator" id="calculator" novalidate>
      <!-- Строка 1 -->
      <section class="row row--grid-2" aria-label="Стоимость и кредит">
        <div class="field">
          <label for="apartmentCost">Стоимость квартиры</label>
          <input type="number" id="apartmentCost" min="0" step="5000" value="315000">
        </div>
        <div class="field">
          <label for="downPayment">Первоначальный взнос</label>
          <input type="number" id="downPayment" min="0" step="1000" value="31500">
        </div>
        <div class="field">
          <label for="downPaymentPercent">Первоначальный взнос, %</label>
          <input type="number" id="downPaymentPercent" min="0" max="100" step="5" value="10">
        </div>
        <div class="field field--readonly">
          <label for="loanAmount">Сумма кредита</label>
          <output id="loanAmount" class="output-value">-</output>
        </div>
      </section>

      <!-- Строка 2 -->
      <section class="row" aria-label="Ипотека">
        <div class="field">
          <label for="rate1">Ипотечный процент, % годовых</label>
          <input type="number" id="rate1" min="0" max="100" step="0.1" value="2.55">
        </div>
        <div class="field">
          <label for="termYears">Срок кредита, лет</label>
          <input type="number" id="termYears" min="1" max="40" step="5" value="30">
        </div>
        <div class="field field--readonly">
          <label>Ежемесячный платёж</label>
          <output id="monthlyPayment1" class="output-value">—</output>
        </div>
      </section>

      <!-- Строка 3 -->
      <section class="row" aria-label="Налог на покупку">
        <div class="field field--combo">
          <label for="purchaseTaxPercent">Налог на покупку, %</label>
          <input type="number" id="purchaseTaxPercent" min="0" max="100" step="0.5" value="9">
          <output id="purchaseTaxAmount" class="output-value">—</output>
        </div>
      </section>

      <!-- Строка 4 -->
      <section class="row" aria-label="Страховки (в год)">
        <h3 class="section-title">Страховки</h3>
        <div class="field-duo">
          <label for="homeInsurance">Имущество</label>
          <input type="number" id="homeInsurance" min="0" step="100" value="350">
          <label for="lifeInsurance">Жизнь</label>
          <input type="number" id="lifeInsurance" min="0" step="100" value="1550">
          <label for="alarmaInsurance">Alarma</label>
          <input type="number" id="alarmaInsurance" min="0" step="50" value="550">
        </div>
      </section>

      <section class="row" aria-label="Комиссии">
        <h3 class="section-title">Комиссии</h3>
        <div class="field">
          <label for="notaryFee">Нотариус</label>
          <input type="number" id="notaryFee" min="0" step="100" value="500">
        </div>
        <div class="field">
          <label for="appraiserFee">Оценщик</label>
          <input type="number" id="appraiserFee" min="0" step="100" value="500">
        </div>
        <div class="field field--combo">
          <label for="agent1Percent">Агент покупателя, %</label>
          <input type="number" id="agent1Percent" min="0" max="100" step="0.5" value="1">
          <input type="number" id="agent1Amount" min="0" step="50" value="2500" data-no-stepper class="field-input--soft">
        </div>
        <div class="field field--combo">
          <label for="agent2Percent">Агент продавца, %</label>
          <input type="number" id="agent2Percent" min="0" max="100" step="0.5" value="3">
          <input type="number" id="agent2Amount" min="0" step="50" value="7500" data-no-stepper class="field-input--soft">
        </div>
        <div class="field field--combo">
          <label for="agent2SharePercent">НДС комиссии агента продавца, %</label>
          <input type="number" id="agent2SharePercent" min="0" max="100" step="0.1" value="21">
          <output id="agent2Payable" class="output-value">—</output>
        </div>
      </section>

      <!-- Итог -->
      <section class="row row--pair row--summary" aria-label="Итоговые расходы">
        <div class="field field--readonly field--hint-full">
          <label>Разовые первоначальные расходы</label>
          <output id="initialExpenses" class="output-value output-value--large">—</output>
          <p class="hint" id="initialExpensesHint"></p>
        </div>
        <div class="field field--readonly">
          <label>Ежемесячная выплата</label>
          <output id="monthlyBreakdown1" class="output-value output-value--large">—</output>
          <p class="hint" id="monthlyHint1"></p>
        </div>
        <div class="field field--readonly">
          <label>Переплата по процентам</label>
          <output id="totalInterestOverpay" class="output-value output-value--large">—</output>
          <p class="hint" id="totalInterestHint"></p>
        </div>
        <div class="field field--readonly">
          <label>Переплата по страховкам</label>
          <output id="totalInsuranceOverpay" class="output-value output-value--large">—</output>
          <p class="hint" id="totalInsuranceHint"></p>
        </div>
      </section>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
